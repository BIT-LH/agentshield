[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "1.0.0"
description = "AI Agent 扩展 / 技能 / MCP Server 的供应链安全审计器"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "AgentShield contributors" }]
keywords = ["security", "supply-chain", "ai", "mcp", "claude", "sast", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# 刻意保持零运行时依赖：开箱即用，不需要联网安装任何东西
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agentshield = "agentshield.cli:main"

[project.urls]
Homepage = "https://github.com/agentshield/agentshield"
Documentation = "https://github.com/agentshield/agentshield/tree/main/docs"
Issues = "https://github.com/agentshield/agentshield/issues"

[tool.setuptools]
packages = ["agentshield", "agentshield.reporters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
